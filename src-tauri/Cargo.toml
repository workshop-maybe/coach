[package]
name = "coach"
version = "0.2.1"
description = "Build credentials and offer them to your agents"
authors = ["Andamio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
sha2 = "0.10"
base64 = "0.22"
# Decodes save_image's folder header (KTD3). Already in the tree through tauri.
percent-encoding = "2"
# Jev Mode (KTD1, KTD2). reqwest is called from Rust, never through tauri-plugin-http,
# so no capability can make the web view a fetcher; its `rustls` feature verifies TLS
# with the OS trust store. The key store is chosen per platform below, never keyring's
# `cli` feature or a database-backed store.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
keyring-core = "1"
zeroize = "1"

# Desktop only: remembers the window's size and position across launches (R5, KTD2).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
# Reads the paths of files copied in Finder for a paste (KTD5). Already in the tree
# through tauri-plugin-clipboard-manager.
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# zbus already runs on async-io in this tree (tauri-plugin-opener), so the store does too.
# `secret-service` is named only to recognize its "unavailable" error at startup.
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
secret-service = { version = "5", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
